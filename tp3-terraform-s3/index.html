<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon App Cloud 🚀</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px 60px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { color: #1a3a6b; }
    p  { color: #555; }
    .badge {
      background: #e8f4fd;
      color: #0b65c2;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      display: inline-block;
      margin-top: 12px;
    }
    .tf-badge {
      background: #f3f0ff;
      color: #6d28d9;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      display: inline-block;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Mon Application Cloud</h1>
    <p>Déployée sur <strong>Amazon S3</strong> (via LocalStack).</p>
    <p>Aucun serveur. Aucune VM. Juste un bucket et une URL.</p>
    <div class="badge">2CLD3 – Formation Introduction au Cloud</div><br>
    <div class="tf-badge">🟣 Déployé avec Terraform</div>
  </div>
</body>
</html>
